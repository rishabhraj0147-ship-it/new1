# WorldPulse: refreshes returns for every listed stock on NSE, BSE, NYSE, NASDAQ and NYSE American.
# Runs after the Indian close and after the US close. The 15-minute workflow publishes the result.
name: Update all listed stocks

on:
  schedule:
    - cron: "30 11 * * 1-5"    # 5:00 pm IST, after NSE/BSE close
    - cron: "45 21 * * 1-5"    # after the US close
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/update_universe.py", ".github/workflows/update-universe.yml"]

permissions:
  contents: write

concurrency:
  group: worldpulse-universe
  cancel-in-progress: false

jobs:
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Get the previous list
        run: |
          mkdir -p data
          if git fetch --depth 1 origin data-universe 2>/dev/null; then git --work-tree=. checkout FETCH_HEAD -- data && git reset -q data; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Fetch all listed stocks
        run: python scripts/update_universe.py

      - name: Save (latest copy only, on the data-universe branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f data/universe.json || { echo "No universe.json produced"; exit 0; }
          rm -rf /tmp/pub && mkdir -p /tmp/pub/data
          cp data/universe.json /tmp/pub/data/
          cp -r data/charts /tmp/pub/data/ 2>/dev/null || true
          cd /tmp/pub
          git init -q -b data-universe
          git add -A
          git -c user.name="worldpulse-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "All listed stocks $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:data-universe
