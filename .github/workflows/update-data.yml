# WorldPulse: fetches fresh news and prices every 15 minutes, saves them in data/,
# and publishes the website on GitHub Pages.
# One-time setup: Settings → Pages → Source = "GitHub Actions".
name: Update news and publish site

on:
  schedule:
    - cron: "*/15 * * * *"     # every 15 minutes (GitHub sometimes starts it a few minutes late)
  workflow_dispatch:            # adds a "Run workflow" button on the Actions tab
  push:
    branches: [main]            # re-publish when you edit index.html
    paths-ignore: ["data/**"]

permissions:
  contents: write     # to save the latest data on the "data" branch
  pages: write        # to publish the site
  id-token: write

concurrency:
  group: worldpulse
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Data lives on two side branches that keep only the latest copy (so the repository never balloons):
      #   data           – news, prices, top performers, funds (this workflow)
      #   data-universe  – all listed stocks + their charts   (update-universe.yml)
      - name: Get the latest data
        run: |
          mkdir -p data
          for b in data data-universe; do
            if git fetch --depth 1 origin "$b" 2>/dev/null; then git --work-tree=. checkout FETCH_HEAD -- data && git reset -q data; fi
          done
          ls -la data || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Fetch news and prices
        run: python scripts/update_data.py
        env:
          # Optional: add a repository secret named ANTHROPIC_API_KEY and Claude writes the crux + impact
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Save data (latest copy only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/pub && mkdir -p /tmp/pub/data
          cp data/news.json data/prices.json /tmp/pub/data/ 2>/dev/null || true
          cp data/performers.json data/funds.json data/active.json /tmp/pub/data/ 2>/dev/null || true
          cd /tmp/pub
          git init -q -b data
          git add -A
          git -c user.name="worldpulse-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Latest news and prices $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
